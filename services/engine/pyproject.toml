[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "course-engine"
version = "0.1.0"
description = "Local-first course import and parsing engine"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]

[project.scripts]
course-engine = "course_engine.cli:main"

[tool.setuptools.packages.find]
include = ["course_engine*"]
